name: tadamon

description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

licenses:
  - GPL-3.0

environment:
  sdk: ^3.8.1

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.0.0
  connectivity_plus: ^6.1.1
  equatable: ^2.0.5
  file_picker: ^10.1.2
  firebase_core: ^4.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_localizations:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  google_mlkit_barcode_scanning: ^0.14.1
  google_nav_bar: ^5.0.7
  image_picker: ^1.1.2
  intl: ^0.20.2
  lottie: ^3.3.1
  objectbox: ^4.1.0
  objectbox_flutter_libs: ^4.1.0
  open_file: ^3.5.10
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  share_plus: ^11.0.0
  shared_preferences: ^2.5.2
  simple_barcode_scanner: ^0.3.0
  smooth_page_indicator: ^1.2.0+3
  toastification: ^3.0.3
  url_launcher: ^6.3.1


dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  intl_utils: ^2.8.8
  objectbox_generator: ^4.1.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4



flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/lottie/



  fonts:
    - family: ArabicFont
      fonts:
        - asset: assets/fonts/ar/Tajawal-Regular.ttf


flutter_intl:
  enabled: true
  main_locale: ar
  default_locale: ar
